
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IntelliCare 360 | Customer Support</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 720px;
            margin: 30px auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .required {
            color: #dc2626;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: #ffffff;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .help-text {
            margin-top: 6px;
            font-size: 12px;
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>IntelliCare 360</h1>
        <h2>Customer Support Request</h2>
        <p>
            Submit your complaint or service request.
            Our support team will review your case.
        </p>
    </div>

    <!-- Salesforce Web-to-Case Form -->
    <form
        action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00Dbm000019klUT"
        method="POST">

        <input type="hidden" name="orgid" value="00Dbm000019klUT">

        <input
            type="hidden"
            name="retURL"
            value="http://localhost:5173/thank-you">

        <!-- Case Record Type -->
        <div class="form-group">
            <label for="recordType">
                Case Record Type <span class="required">*</span>
            </label>

            <select id="recordType" name="recordType" required>
                <option value="">Select Record Type</option>
                <option value="012bm00000Dxnhx">Account Support</option>
                <option value="012bm00000DxnQD">Loan Support</option>
                <option value="012bm00000DxnTR">Payment Support</option>
            </select>
        </div>

        <!-- Contact Name -->
        <div class="form-group">
            <label for="name">
                Contact Name <span class="required">*</span>
            </label>

            <input
                id="name"
                maxlength="80"
                name="name"
                type="text"
                placeholder="Enter your full name"
                required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">
                Email Address <span class="required">*</span>
            </label>

            <input
                id="email"
                maxlength="80"
                name="email"
                type="email"
                placeholder="example@email.com"
                required>
        </div>

        <!-- Phone -->
        <div class="form-group">
            <label for="phone">Phone Number</label>

            <input
                id="phone"
                maxlength="40"
                name="phone"
                type="tel"
                placeholder="Enter your phone number">
        </div>

        <!-- Case Category -->
        <div class="form-group">
            <label for="00Nbm000049UYY7">
                Case Category <span class="required">*</span>
            </label>

            <select
                id="00Nbm000049UYY7"
                name="00Nbm000049UYY7"
                title="Case Category"
                required>

                <option value="">Select Category</option>
                <option value="Loan">Loan</option>
                <option value="Payment">Payment</option>
                <option value="Account">Account</option>
                <option value="Document">Document</option>
                <option value="General Inquiry">General Inquiry</option>
            </select>
        </div>

        <!-- Sub Category -->
        <div class="form-group">
            <label for="00Nbm000049Udr7">Sub Category</label>

            <input
                id="00Nbm000049Udr7"
                maxlength="100"
                name="00Nbm000049Udr7"
                type="text"
                placeholder="e.g. EMI Issue, Transaction Failure">
        </div>

        <!-- Customer Reference -->
        <div class="form-group">
            <label for="00Nbm000049UycD">Customer Reference</label>

            <input
                id="00Nbm000049UycD"
                maxlength="30"
                name="00Nbm000049UycD"
                type="text"
                placeholder="Enter your customer reference">
        </div>

        <!-- Subject -->
        <div class="form-group">
            <label for="subject">
                Subject <span class="required">*</span>
            </label>

            <input
                id="subject"
                maxlength="80"
                name="subject"
                type="text"
                placeholder="Briefly describe your issue"
                required>
        </div>

        <!-- Description -->
        <div class="form-group">
            <label for="description">
                Description <span class="required">*</span>
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Explain your complaint or service request in detail..."
                required></textarea>
        </div>

        <!-- Severity -->
        <div class="form-group">
            <label for="00Nbm000049Uo8D">Severity</label>

            <select
                id="00Nbm000049Uo8D"
                name="00Nbm000049Uo8D"
                title="Severity">

                <option value="">Select Severity</option>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>

        <!-- Customer Impact -->
        <div class="form-group">
            <label for="00Nbm000049UrsT">Customer Impact</label>

            <select
                id="00Nbm000049UrsT"
                name="00Nbm000049UrsT"
                title="Customer Impact">

                <option value="">Select Customer Impact</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>

        <!-- Submit -->
        <button type="submit" name="submit">
            Submit Support Request
        </button>

    </form>

    <div class="footer">
        IntelliCare 360 | Customer Service Automation
    </div>

</div>

</body>
</html>
